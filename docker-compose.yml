version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: partytube-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: partysecret
      MYSQL_DATABASE: partytube
    ports:
      - '3306:3306'
    volumes:
      - partytube_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-ppartysecret']
      timeout: 10s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: partytube-adminer
    restart: always
    ports:
      - '8080:8080'
    depends_on:
      - mysql

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: partytube-backend
    restart: always
    environment:
      PORT: 3001
      NODE_ENV: production
      DATABASE_URL: 'mysql://root:partysecret@mysql:3306/partytube'
    ports:
      - '3001:3001'
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: partytube-frontend
    restart: always
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  partytube_mysql_data:
